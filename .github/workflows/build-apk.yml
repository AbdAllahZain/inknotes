name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies (also applies patches/)
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Error summary (only when the build fails)
        if: failure()
        run: |
          {
            echo "## Compiler errors (javac / kotlinc / C++)"
            echo '```'
            grep -n -B2 -A8 -E "\.(java|kt|cpp|h|c):[0-9]+(:[0-9]+)?:? .*error|: error:|^e: " build.log | head -120 || true
            echo '```'
            echo "## Gradle summary"
            echo '```'
            grep -n -E "FAILED|What went wrong|Execution failed|Caused by|fatal error|undefined reference|CMake Error|ninja: build stopped|Could not (resolve|find|get)" build.log | head -40 || true
            echo '```'
            echo "## Last 40 lines"
            echo '```'
            tail -n 40 build.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: InkNotes-apk
          path: android/app/build/outputs/apk/release/*.apk
